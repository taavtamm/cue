<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="cue:canvas" content="1280x720">
<title>Cue convention deck</title>
</head>
<body>
<section id="intro" data-cue-slide data-cue-notes="Say hello.">
  <h1>Hello, Cue</h1>
</section>
<section data-cue-slide>
  <h2>Three points</h2>
  <p data-cue-build="1" data-cue-effect="rise">One</p>
  <p data-cue-build="2">Two</p>
  <p data-cue-build="2">Two and a half</p>
  <p data-cue-build="3">Three</p>
  <aside class="notes">Pause after each point.</aside>
</section>
<section data-cue-slide aria-label="Demo">
  <video src="demo.mp4" autoplay loop muted></video>
</section>
</body>
</html>
