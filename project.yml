name: Cue
options:
  bundleIdPrefix: app.cue
  deploymentTarget: { macOS: "27.0" }
  createIntermediateGroups: true
packages:
  CuePackage: { path: . }
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Cue:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: CuePackage
        product: CueCore
      - package: CuePackage
        product: CueRender
      - package: CuePackage
        product: CueUI
      - package: CuePackage
        product: CueEditor
      - package: CuePackage
        product: CueImport
      - package: CuePackage
        product: CueMCP
      - package: CuePackage
        product: CueExport
      # The helper Claude starts (`claude mcp add cue -- …/Contents/MacOS/cue-mcp`).
      - target: cue-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
    entitlements:
      path: App/Cue.entitlements
      properties:
        # parse5 runs in JavaScriptCore; without JIT it is ~20x slower.
        # Deck JavaScript never runs here, only inside WKWebView.
        com.apple.security.cs.allow-jit: true
        # Opening .key, .ppt and .odp asks Keynote for a PowerPoint copy.
        com.apple.security.automation.apple-events: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cue
        NSAppleEventsUsageDescription: Cue asks Keynote to convert Keynote, PowerPoint 97 and OpenDocument files so you can present and edit them.
        NSFocusStatusUsageDescription: Cue warns you before a show when Focus is off, so notifications don't appear on the projector.
        CFBundleShortVersionString: "0.1"
        LSApplicationCategoryType: public.app-category.productivity
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML Presentation
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html]
          - CFBundleTypeName: Presentation
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.presentationml.presentation
              - com.microsoft.powerpoint.ppt
              - com.apple.iwork.keynote.key
              - com.apple.keynote.key
              - org.oasis-open.opendocument.presentation
              - com.adobe.pdf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cue.Cue
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  # Pipes Claude's stdio to Cue's MCP socket. Foundation only; same source as the package's cue-mcp.
  cue-mcp:
    type: tool
    platform: macOS
    sources:
      - Sources/cue-mcp
    settings:
      base:
        PRODUCT_NAME: cue-mcp
        ENABLE_HARDENED_RUNTIME: YES
